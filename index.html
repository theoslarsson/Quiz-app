<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="title">Quiz</h1>
        <h2 class="welcome">Welcome to the quiz!</h2>
    </header>
    <main>
        <p id="question" class="question">question</p>

        <button class="option">[Option 1]</button>
        <button class="option">[Option 2]</button>
        <button class="option">[Option 3]</button>
        <button class="option">[Option 4]</button>

        <p id="score" class="score">Score: 0</p>
        
        <p id="feedback"></p>

        <button id="restart" class="next" hidden>Restart</button>

    
        <button id="next" class="next" hidden>[Next question]</button>

    </main>
    <footer></footer>

    <script src="script.js"></script>
</body>
</html>
